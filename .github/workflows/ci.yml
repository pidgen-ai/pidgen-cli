name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    # The oldest Node the CLI supports (package.json engines) and the current one on Linux; the
    # macOS job below runs the current one on the other platform workers run on.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, node: 22 }
          - { os: ubuntu-latest, node: 24 }
    steps: &steps
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Unit tests, leaving nothing in the temporary directory
        run: npm run test:tmp-check
      - name: Contract tests against a Prism mock server
        run: npm run test:contract
      - name: Docs meet the docs bundle contract
        run: npm run docs:check
      - run: npm run build
      - run: node dist/pidgen.js --version
      - name: Generated API types match the committed contract
        run: |
          npm run contract:generate
          git diff --exit-code -- src/generated || {
            echo "::error::src/generated/api.d.ts is stale: run npm run contract:generate and commit it"
            exit 1
          }

  # The same steps on macOS, only on GitHub, whose hosted runners provide it: a copy of this
  # repository on another forge runs these workflows with Linux runners only. It follows the Linux
  # jobs because a forge decides a job's `if` itself only for a job that waits on others.
  test-macos:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    needs: test
    if: github.server_url == 'https://github.com'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - { os: macos-latest, node: 24 }
    steps: *steps
