name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    # The oldest Node the CLI supports (package.json engines) and the current one on Linux, and the
    # current one on macOS, the other platform workers run on.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, node: 22 }
          - { os: ubuntu-latest, node: 24 }
          - { os: macos-latest, node: 24 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Contract tests against a Prism mock server
        run: npm run test:contract
      - name: Docs meet the docs bundle contract
        run: npm run docs:check
      - run: npm run build
      - run: node dist/pidgen.js --version
      - name: Generated API types match the committed contract
        run: |
          npm run contract:generate
          git diff --exit-code -- src/generated || {
            echo "::error::src/generated/api.d.ts is stale: run npm run contract:generate and commit it"
            exit 1
          }
